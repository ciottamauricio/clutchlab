<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Clutchlab mark: a lab flask (the "lab") holding the CT/T split liquid (the two sides). -->
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="15"/></clipPath>
    <clipPath id="body"><path d="M27 26 L12 53 Q11 56.5 15 56.5 L49 56.5 Q53 56.5 52 53 L37 26 Z"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#0e1116"/>

    <!-- the two-sided liquid, clipped to the flask body -->
    <g clip-path="url(#body)">
      <rect x="0" y="40" width="32" height="18" fill="#58a6e8"/>
      <rect x="32" y="40" width="32" height="18" fill="#e3a93c"/>
    </g>

    <!-- bubbles -->
    <g fill="#ffffff">
      <circle cx="25" cy="48" r="2" opacity="0.85"/>
      <circle cx="34" cy="52" r="1.5" opacity="0.7"/>
      <circle cx="29" cy="54.5" r="1.2" opacity="0.55"/>
    </g>

    <!-- glassware outline -->
    <g fill="none" stroke="#ecf1f7" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M24 10 L27 12 L27 26 L12 53 Q11 56.5 15 56.5 L49 56.5 Q53 56.5 52 53 L37 26 L37 12 L40 10"/>
    </g>
  </g>
</svg>
