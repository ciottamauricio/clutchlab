services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on: [api, frontend, realtime]
    networks: [clutchnet]

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules          # keep container's node_modules, don't shadow with host
    environment:
      - VITE_API_URL=/api
    networks: [clutchnet]

  api:
    build: ./api
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./api:/var/www/html
      - ./contracts:/var/www/contracts:ro   # shared wire-contract fixtures (../contracts in tests)
      - .:/var/www/project:ro               # repo root, read-only: docs:embed reads markdown outside ./api
    env_file: .env
    depends_on: [postgres, redis, minio, meilisearch, jaeger]
    networks: [clutchnet]

  # Laravel as an event subscriber: blocks on clutch_events and turns facts into
  # Laravel-side reactions (today: emailing a training's roster on training.scheduled).
  # Same image as api; its own long-lived process. Mail uses MAIL_MAILER (log by default).
  events-listener:
    build: ./api
    command: php artisan events:listen
    volumes:
      - ./api:/var/www/html
      - ./contracts:/var/www/contracts:ro
    env_file: .env
    depends_on: [postgres, redis]
    networks: [clutchnet]

  # Laravel's scheduler as its own process (schedule:work blocks and fires due tasks).
  # Its one job today is matches:reconcile every minute — the safety net that self-heals a
  # match stranded in "parsing" by a lost parse-outcome event (the split's at-most-once
  # gap; see docs/plans/split-the-database.md). Same image as api; no inbound anything.
  scheduler:
    build: ./api
    command: php artisan schedule:work
    volumes:
      - ./api:/var/www/html
      - ./contracts:/var/www/contracts:ro
    env_file: .env
    depends_on: [postgres, redis]
    networks: [clutchnet]

  worker:
    build: ./worker
    volumes:
      - ./worker:/app
      - ./contracts:/contracts:ro           # shared wire-contract fixtures (../contracts in tests)
    env_file: .env
    depends_on: [redis, minio, postgres, meilisearch]
    networks: [clutchnet]

  # Real-time tactics service (Go, websockets). Reached only through nginx at /realtime.
  realtime:
    build: ./realtime
    volumes:
      - ./realtime:/app
    env_file: .env
    depends_on: [postgres]
    networks: [clutchnet]

  # Event subscriber (Go): listens to the pub/sub channel the worker publishes on and
  # posts to a Discord webhook (log-only when DISCORD_WEBHOOK_URL is unset).
  notifier:
    build: ./notifier
    volumes:
      - ./notifier:/app
      - ./contracts:/contracts:ro           # shared wire-contract fixtures (../contracts in tests)
    env_file: .env
    depends_on: [redis]
    networks: [clutchnet]

  postgres:
    # pgvector's image = stock Postgres 16 + the `vector` extension (semantic search
    # read model for the analyst). Drop-in for postgres:16; the migration CREATEs the
    # extension. Not -alpine — pgvector publishes a Debian-based image.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"                # optional: connect a DB GUI from host
    networks: [clutchnet]

  redis:
    image: redis:7-alpine
    networks: [clutchnet]

  # Local model runtime, reached at http://ollama:11434 (the default in
  # config/clutch.php's embed.ollama.host). Today it serves embeddings for the analyst's
  # semantic read model; the same server is what an 'ollama' AnalystLlm would generate
  # against. Weights live in a named volume — pulled once, survive `down`.
  #
  # KEEP_ALIVE is short on purpose: this is a batch workload (analyst:embed), not a hot
  # path, so the model should release VRAM instead of squatting on a desktop GPU.
  ollama:
    image: ollama/ollama:0.5.7
    environment:
      OLLAMA_KEEP_ALIVE: 30s
    volumes:
      - ollamadata:/root/.ollama
    networks: [clutchnet]
    # GPU is an optimisation, not a requirement: embedding a small corpus on CPU is
    # seconds. Needs the NVIDIA Container Toolkit on the host — without it Compose fails
    # to START this service, so drop this block to run CPU-only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # One-shot: pulls the embedding model so the first analyst:embed doesn't fail on a
  # missing model. Same shape as minio-init (wait for the service, make the thing exist).
  ollama-init:
    image: ollama/ollama:0.5.7
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      sh -c "until ollama list >/dev/null 2>&1; do echo 'waiting for ollama'; sleep 2; done;
             ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text};
             echo 'embedding model ready'"
    networks: [clutchnet]

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    ports:
      - "7700:7700"                # optional: Meili dashboard/API from host
    networks: [clutchnet]

  # One-shot: waits for MinIO, then creates the demos bucket so the first upload
  # doesn't 404. Replaces the manual "create the bucket in the console" step.
  minio-init:
    image: minio/mc
    depends_on: [minio]
    env_file: .env
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do echo 'waiting for minio'; sleep 2; done;
             mc mb -p local/$$AWS_BUCKET || true;
             echo 'bucket ready'"
    networks: [clutchnet]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"                # S3 API
      - "9001:9001"                # web console
    networks: [clutchnet]

  # --- Observability (docs/ARCHITECTURE.md, "Observability") ---
  # Loki stores logs; Alloy tails every container's stdout via the Docker socket and
  # ships them; Grafana is the query UI. Zero code changes in the services.

  loki:
    image: grafana/loki:3.4.2
    volumes:
      - lokidata:/loki
    networks: [clutchnet]

  alloy:
    image: grafana/alloy:v1.7.5
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/alloy.config:/etc/alloy/config.alloy:ro
    depends_on: [loki]
    networks: [clutchnet]

  # Trace backend: services export OpenTelemetry spans here (OTLP :4318); the UI on
  # :16686 shows one upload as a waterfall across api → worker → notifier.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"              # Jaeger UI (dev convenience)
    networks: [clutchnet]

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      # Dev-only: no login wall, straight to the Explore view.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - grafanadata:/var/lib/grafana
      - ./observability/grafana:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"                # Grafana UI (dev convenience, like Meili's 7700)
    depends_on: [loki]
    networks: [clutchnet]

  # Static analysis, on demand. Behind a profile so `docker compose up` never starts it:
  # this is a tool that runs and exits, not a service. Invoke it explicitly —
  #
  #   docker compose run --rm semgrep
  #
  # Baseline for step 5 of docs/plans/local-llm-next-steps.md: 221 rules over 435 files
  # found nothing real, so the LLM triage layer sketched there was NOT built — one false
  # positive is not a corpus to rank. Pinned and deterministic; the repo scans clean, so
  # a new finding means new code, not a new ruleset.
  #
  # The repo is mounted read-only: a scanner has no business writing to the tree it scans.
  # Rules are cached in a named volume so repeat runs don't re-fetch the registry, and
  # SEMGREP_SEND_METRICS=off keeps findings metadata on this machine (the default
  # --config=auto would phone home).
  semgrep:
    image: semgrep/semgrep:1.86.0
    profiles: [tools]
    environment:
      SEMGREP_SEND_METRICS: "off"
    volumes:
      - .:/src:ro
      - semgrepcache:/root/.semgrep
    working_dir: /src
    # Overridable: `docker compose run --rm semgrep semgrep --config=p/php api/app`
    command: >
      semgrep scan
        --config=p/security-audit
        --config=p/php
        --config=p/javascript
        --config=p/golang
        --metrics=off
        --error
    networks: [clutchnet]

volumes:
  pgdata:
  miniodata:
  meilidata:
  lokidata:
  grafanadata:
  ollamadata:
  semgrepcache:

networks:
  clutchnet:
    driver: bridge
