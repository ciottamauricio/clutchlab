# Deploy + DORA instrumentation for the api service. Separate from api.yml (which
# tests): a deploy is main-only and must not run on a pull request.
#
# deploy.reusable.yml is in the filter for the same reason contracts/** is: all three
# services share it, so a change there affects this deploy even when api/ is untouched.
name: deploy-api

on:
  push:
    branches: [main]
    paths: ["api/**", "contracts/**", ".github/workflows/deploy.api.yml", ".github/workflows/deploy.reusable.yml"]

jobs:
  deploy:
    uses: ./.github/workflows/deploy.reusable.yml
    with:
      service: api
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DORA_INGEST_TOKEN: ${{ secrets.DORA_INGEST_TOKEN }}
      DORA_API_URL: ${{ secrets.DORA_API_URL }}
