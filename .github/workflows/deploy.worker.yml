# Deploy + DORA instrumentation for the worker service. Separate from worker.yml (which
# tests): a deploy is main-only and must not run on a pull request.
#
# The commented push filter includes deploy.reusable.yml for the same reason it includes
# contracts/**: all three services share that file, so a change there affects this deploy
# even when worker/ is untouched.
name: deploy-worker

# Manual until a production environment exists. The deploy step is unimplemented and
# exits non-zero, so on `push` these three ran red on every commit to main -- and a
# permanently-red check is one people learn to scroll past, which costs more than the
# signal is worth. Dispatch keeps them runnable on demand without that cost.
#
# RESTORE THE PUSH TRIGGER when the deploy is implemented: uncomment the block below.
# Deployment frequency counts what CI records, so a deploy nobody remembered to click
# is a deploy the metric never sees.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["worker/**", "contracts/**", ".github/workflows/deploy.worker.yml", ".github/workflows/deploy.reusable.yml"]

jobs:
  deploy:
    uses: ./.github/workflows/deploy.reusable.yml
    with:
      service: worker
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DORA_INGEST_TOKEN: ${{ secrets.DORA_INGEST_TOKEN }}
      DORA_API_URL: ${{ secrets.DORA_API_URL }}
