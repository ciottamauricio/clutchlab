# No frontend test suite yet — the build itself is the check (it catches syntax
# errors, bad imports, and broken JSX). Vitest jobs slot in here when tests exist.
name: frontend

on:
  push:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # npm skips platform-specific optional deps resolved on another libc
      # (npm/cli#4828) — the lockfile is written inside the musl (alpine) dev
      # container, the runner is glibc. Install the missing native binding at the
      # lockfile's exact version if npm ci left it out.
      - run: |
          node -e "require('@rolldown/binding-linux-x64-gnu')" 2>/dev/null || \
            npm i --no-save @rolldown/binding-linux-x64-gnu@"$(node -p "require('./package-lock.json').packages['node_modules/@rolldown/binding-linux-x64-musl'].version")"
      - run: npm run build
