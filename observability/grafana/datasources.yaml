# Provisioned datasources — Grafana finds Loki (logs) and Jaeger (traces) on boot, no clicking.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true

  - name: Jaeger
    type: jaeger
    access: proxy
    # Jaeger all-in-one serves its query API on the same port as the UI (16686), by
    # service name on the Docker network.
    url: http://jaeger:16686
