server {
    listen 80;
    server_name localhost;
    client_max_body_size 1024M;     # CS2 demos are big (long 128-tick matches ~700M+)

    # React frontend (Vite dev server + HMR websocket)
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Ollama (estudo de similaridade em /ollama-study). Mesma origem que o
    # frontend, entao o browser nao precisa de CORS nem de ponte na porta 11434.
    # O trailing slash em ambos os lados troca /ollama-api/ por / no upstream.
    location /ollama-api/ {
        proxy_pass http://ollama:11434/;

        # O Ollama valida a origem e so aceita localhost/127.0.0.1. Como a pagina
        # pode ser aberta pelo IP do WSL (http://172.x.x.x:8080), repassar o Host
        # e o Origin originais faz o Ollama responder 403. Normalizamos os dois:
        # quem faz o controle de acesso aqui e o nginx, nao o Ollama.
        proxy_set_header Host localhost:11434;
        proxy_set_header Origin http://localhost:11434;

        proxy_read_timeout 300s;    # carregar um modelo frio leva ~8s; geracao pode passar disso
        proxy_send_timeout 300s;
    }

    # Laravel API — NO trailing slash on proxy_pass, so the /api prefix
    # is preserved (Laravel's routes/api.php is already served under /api).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Realtime websocket service (Go). No trailing slash keeps the /realtime prefix.
    location /realtime/ {
        proxy_pass http://realtime:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # keep idle websockets open
    }
}
